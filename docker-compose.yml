# Pulse 一键部署栈（TLS 反向代理 + 单 JAR 应用 + MySQL）
#
# 用法：
#   1. 生成加密主密钥：    ./scripts/gen-key.sh
#   2. 生成 JWT 密钥：      openssl rand -hex 32
#   3. 复制并填写环境变量：  cp .env.example .env
#      （至少填 PULSE_ENCRYPTION_KEY 与 JWT_SECRET，二者缺失即 fail-fast 拒绝启动）
#   4. 启动：              docker compose up -d --build
#
# 说明：
#   - 应用经 nginx 终止 TLS（443），并以 wss: 暴露实时通道；明文 80 强制跳转 HTTPS。
#   - 生产务必在 ./certs 提供真实证书，否则 proxy 自动生成自签名证书（浏览器会告警）。
#   - 上传目录挂载 pulse-uploads 卷，容器重建不丢文件。
services:
  db:
    image: mysql:8.0
    environment:
      # 必填，无默认弱口令；缺失则数据库容器无法初始化
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pulse
      # 传递给 init 脚本，用于创建最小权限应用账号 pulse_app
      PULSE_DB_PASSWORD: ${PULSE_DB_PASSWORD}
    volumes:
      - pulse-db:/var/lib/mysql
      # 初始化脚本：仅首次建库时创建 pulse_app 专用账号（root 不交付应用）
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # 生产 schema：由 MySQL 初始化卷在首次建库时一次性执行（幂等 CREATE TABLE IF NOT EXISTS），
      # 与应用侧 SQL_INIT_MODE=never 配合，避免应用每次启动重跑 schema。
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    # 应用以非 root 用户（uid:gid=1000:1000）运行
    user: "1000:1000"
    environment:
      PULSE_ENCRYPTION_KEY: ${PULSE_ENCRYPTION_KEY}
      DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mysql://db:3306/pulse?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
      # 应用使用最小权限专用账号 pulse_app（由 db init 脚本创建），不再使用 root
      MYSQL_USER: ${PULSE_DB_USER:-pulse_app}
      MYSQL_PASSWORD: ${PULSE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      APP_UPLOAD_DIR: /app/uploads
      # 由反向代理转发协议头，使 request.isSecure() 正确识别 HTTPS（Secure Cookie 生效）
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # 数据库 schema 初始化方式：never=由上方 db 初始化卷一次性建表（生产推荐）；
      # always=由应用每次启动自建表（幂等 CREATE TABLE IF NOT EXISTS，适合裸 java -jar 开发）。
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
      # 事务邮件（密码重置等）：默认关闭仅记日志；启用需提供 SMTP 凭据
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:}
      MAIL_PORT: ${MAIL_PORT:587}
      MAIL_USERNAME: ${MAIL_USERNAME:}
      MAIL_PASSWORD: ${MAIL_PASSWORD:}
      MAIL_FROM: ${MAIL_FROM:no-reply@pulse.local}
      MAIL_FRONTEND_BASE_URL: ${MAIL_FRONTEND_BASE_URL:http://localhost:5173}
    restart: unless-stopped
    volumes:
      - pulse-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  proxy:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - pulse-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  pulse-db:
  pulse-uploads:
  pulse-certs:
